<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURELIAN :: Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #020617;
            --panel-dark: #0b0d12;
            --accent-primary: #6366f1;
            --accent-secondary: #4338ca;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --border-color: #1e1b4b;
            --terminal-green: #4ade80;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background: var(--panel-dark);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .brand {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--accent-primary);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-menu { list-style: none; flex-grow: 1; }

        .nav-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(99, 102, 241, 0.1);
            color: var(--text-main);
            border-left: 3px solid var(--accent-primary);
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .top-bar {
            padding: 20px 40px;
            background: rgba(11, 13, 18, 0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .module-container { padding: 40px; }

        /* --- UI DEL ARCHITECT STUDIO --- */
        .architect-ui {
            max-width: 800px;
            margin: 0 auto;
            background: var(--panel-dark);
            padding: 35px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .sentinel-header {
            color: var(--accent-primary);
            font-family: 'Cinzel', serif;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group { margin-bottom: 25px; text-align: left; }

        .input-group label {
            display: block;
            color: var(--accent-primary);
            font-size: 11px;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: 1.5px;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            background: #020617;
            border: 1px solid var(--border-color);
            padding: 15px;
            color: white;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: 0.3s;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--accent-primary);
            outline: none;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
        }

        .input-group textarea { height: 150px; resize: none; }

        #btn-refine {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, var(--accent-secondary), var(--accent-primary));
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
        }

        #btn-refine:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4); }
        #btn-refine:disabled { opacity: 0.5; cursor: not-allowed; }

        .terminal-box {
            margin-top: 30px;
            background: #020617;
            padding: 20px;
            border-left: 3px solid var(--terminal-green);
            font-family: 'Courier New', monospace;
            font-size: 13px;
            text-align: left;
            line-height: 1.6;
        }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        /* Estilo para el Dashboard principal */
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .stat-card { background: var(--panel-dark); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); }
        .stat-card h3 { color: var(--text-dim); font-size: 0.8rem; margin-bottom: 10px; }
        .stat-card p { font-size: 2rem; font-weight: bold; color: var(--accent-primary); }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="brand">
        <i class="fas fa-crown"></i>
        AURELIAN
    </div>
    <ul class="nav-menu">
        <li class="nav-item active" onclick="loadModule('dashboard')">
            <i class="fas fa-chart-line"></i> Dashboard
        </li>
        <li class="nav-item" onclick="loadModule('architect')">
            <i class="fas fa-compass-drafting"></i> Architect Studio
        </li>
        <li class="nav-item" onclick="loadModule('agents')">
            <i class="fas fa-robot"></i> Legio AI
        </li>
        <li class="nav-item" onclick="loadModule('settings')">
            <i class="fas fa-cog"></i> Configuración
        </li>
    </ul>
</aside>

<main class="main-content">
    <header class="top-bar">
        <h2 id="module-title" style="font-family: 'Cinzel', serif;">CENTRO DE MANDO</h2>
        <div class="user-profile">
            <span style="font-size: 0.8rem; color: var(--text-dim);">PROJECT LEAD :: </span>
            <span style="font-weight: bold;">IÑAKI</span>
        </div>
    </header>

    <section id="module-body" class="module-container">
    </section>
</main>

<script>
    // Inicializar el Dashboard al cargar
    window.onload = () => loadModule('dashboard');

    function loadModule(module) {
        const body = document.getElementById('module-body');
        const title = document.getElementById('module-title');

        // Actualizar navegación visual
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        event?.currentTarget?.classList?.add('active');

        if (module === 'dashboard') {
            title.innerText = "ESTADO DE LA LEGIÓN";
            body.innerHTML = `
                    <div class="stat-grid">
                        <div class="stat-card"><h3>PROYECTOS ACTIVOS</h3><p>0</p></div>
                        <div class="stat-card"><h3>AGENTES EN LÍNEA</h3><p>2</p></div>
                        <div class="stat-card"><h3>TAREAS COMPLETADAS</h3><p>12</p></div>
                    </div>
                    <div style="margin-top: 40px; padding: 20px; border: 1px dashed var(--border-color); text-align: center;">
                        <p style="color: var(--text-dim);">No hay eventos recientes en el Tabularium.</p>
                    </div>
                `;
        }

        if (module === 'architect') {
            title.innerText = "ARCHITECT STUDIO :: SENTINEL V1.0";
            body.innerHTML = `
                    <div class="architect-ui">
                        <div class="sentinel-header">
                            <i class="fas fa-microchip"></i>
                            <span>SISTEMA DE ANÁLISIS DE VISIÓN ACTIVO</span>
                        </div>

                        <div class="input-group">
                            <label>NOMBRE DEL PROYECTO (TABULARIUM ID)</label>
                            <input type="text" id="proj-name" placeholder="Ej: Operacion Aureliano..." autocomplete="off">
                        </div>

                        <div class="input-group">
                            <label>VISIÓN TÉCNICA (DESGLOSE PARA EL SENTINEL)</label>
                            <textarea id="proj-vision" placeholder="Describe tu idea técnica. El Sentinel desglosará las features automáticamente..."></textarea>
                        </div>

                        <button id="btn-refine" onclick="initArchitectFlow()">
                            <i class="fas fa-scroll"></i> INICIAR REFINAMIENTO IMPERIAL
                        </button>

                        <div id="terminal-output" class="terminal-box" style="display:none;">
                            <p>> [SISTEMA]: Conectando con el Core 8082...</p>
                            <p id="status-line" class="blink"></p>
                        </div>
                    </div>
                `;
        }

        if (module === 'agents') {
            title.innerText = "LEGIO AI :: AGENTES";
            body.innerHTML = `<p style="color: var(--text-dim);">Módulo en desarrollo. Los agentes están en los cuarteles.</p>`;
        }
    }

    async function initArchitectFlow() {
        const nombre = document.getElementById('proj-name').value;
        const vision = document.getElementById('proj-vision').value;
        const terminal = document.getElementById('terminal-output');
        const statusLine = document.getElementById('status-line');
        const btn = document.getElementById('btn-refine');

        if (!nombre || !vision) {
            alert("Emperador, el Sentinel requiere datos para procesar.");
            return;
        }

        // Feedback Visual
        btn.disabled = true;
        btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> TRANSMITIENDO...";
        terminal.style.display = "block";
        statusLine.innerText = "> [INFO]: Sanitizando y enviando al Tabularium...";

        try {
            // Llamada al Backend de Spring Boot
            const response = await fetch("http://localhost:8082/api/projects/init", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre: nombre, vision: vision })
            });

            if (response.ok) {
                const data = await response.json();
                statusLine.innerHTML = `
                        <span style="color: #4ade80;">> [OK]: Proyecto #${data.id} guardado con éxito.</span><br>
                        <span style="color: #a5b4fc;">> [WAIT]: Master Builder invocado en n8n...</span>
                    `;

                // Resetear botón después de éxito
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = "<i class='fas fa-scroll'></i> INICIAR REFINAMIENTO IMPERIAL";
                }, 4000);
            } else {
                throw new Error("Error en el servidor");
            }
        } catch (error) {
            statusLine.innerHTML = `<span style="color: #f87171;">> [ERROR]: No se pudo contactar con el Backend (Puerto 8082).</span>`;
            btn.disabled = false;
            btn.innerText = "REINTENTAR INVOCACIÓN";
        }
    }
</script>
</body>
</html>
