<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURELIAN AI :: Command Center</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #020617;
            --panel-dark: #0b0d12;
            --accent-primary: #6366f1;
            --accent-secondary: #4338ca;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --border-color: #1f2533;
            --terminal-green: #4ade80;
            --gold: #facc15;
            --error-red: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR --- */
        .sidebar { width: 80px; background-color: var(--panel-dark); border-right: 1px solid var(--border-color); padding: 20px 0; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden; white-space: nowrap; flex-shrink: 0; z-index: 100; }
        .sidebar:hover { width: 260px; }
        .brand-container { display: flex; align-items: center; padding: 0 20px; margin-bottom: 40px; color: var(--accent-primary); cursor: pointer; transition: 0.3s; }
        .brand-name { font-family: 'Cinzel', serif; font-weight: 900; font-size: 18px; margin-left: 15px; opacity: 0; transition: opacity 0.3s; letter-spacing: 2px; }
        .sidebar:hover .brand-name { opacity: 1; }

        .nav-item { display: flex; align-items: center; padding: 15px 25px; cursor: pointer; color: var(--text-dim); transition: 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover, .nav-item.active { background-color: rgba(99, 102, 241, 0.1); color: white; border-left-color: var(--accent-primary); }
        .nav-item .material-icons { min-width: 30px; font-size: 24px; }
        .nav-text { opacity: 0; transition: opacity 0.2s; margin-left: 20px; font-weight: bold; }
        .sidebar:hover .nav-text { opacity: 1; }

        /* --- TOP BAR & TIMER --- */
        #main-wrapper { flex: 1; display: flex; flex-direction: column; background-image: radial-gradient(circle at top right, #161b2d 0%, #020617 40%); overflow: hidden; }
        .top-bar { padding: 15px 40px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: rgba(2, 6, 23, 0.7); backdrop-filter: blur(10px); }

        .monitor-tools { display: flex; align-items: center; gap: 20px; }
        .refresh-container { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); padding: 5px 15px; border-radius: 50px; border: 1px solid var(--border-color); }
        .timer-circle { position: relative; width: 32px; height: 32px; }
        .timer-circle svg { transform: rotate(-90deg); width: 32px; height: 32px; }
        .timer-circle circle { fill: none; stroke-width: 3; stroke: rgba(255,255,255,0.1); }
        .timer-circle .progress { stroke: var(--accent-primary); stroke-dasharray: 88; stroke-dashoffset: 88; transition: stroke-dashoffset 1s linear; }
        #timer-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 10px; font-weight: bold; color: var(--gold); }

        .user-profile-top { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 32px; height: 32px; background: var(--accent-secondary); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; }
        .user-name { font-size: 13px; font-weight: 700; }

        /* --- CONTENT & CARDS --- */
        .content-area { padding: 40px; flex: 1; overflow-y: auto; }
        .card { background: rgba(11, 13, 18, 0.8); backdrop-filter: blur(10px); padding: 30px; border-radius: 16px; border: 1px solid var(--border-color); max-width: 1000px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .module-view { display: none; }
        .module-view.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- OVERVIEW --- */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; margin-bottom: 35px; }
        .stat-card { background: #05070a; padding: 25px; border-radius: 14px; border: 1px solid var(--border-color); text-align: center; }
        .stat-card p { font-size: 2.5rem; font-weight: 900; color: var(--accent-primary); font-family: 'Cinzel', serif; }
        .terminal-box { background: #000; padding: 15px; border-left: 3px solid var(--accent-primary); font-family: 'Courier New', monospace; font-size: 11px; color: var(--terminal-green); height: 180px; overflow-y: auto; border-radius: 0 8px 8px 0; }

        /* --- BENCHMARK TABLE --- */
        .benchmark-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #080a0f; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        .benchmark-table th { background: #12151e; color: var(--accent-primary); padding: 12px; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .benchmark-table td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); font-size: 12px; }
        .status-badge { padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .status-waiting { color: var(--text-dim); border: 1px solid #1f2533; }
        .status-running { color: var(--gold); border: 1px solid var(--gold); }
        .status-done { color: var(--terminal-green); border: 1px solid var(--terminal-green); background: rgba(74, 222, 128, 0.05); }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; color: var(--accent-primary); font-size: 11px; font-weight: 900; margin-bottom: 8px; }
        input, select, textarea { width: 100%; background: #05070a; border: 1px solid var(--border-color); padding: 14px; color: white; border-radius: 8px; }
        .action-btn { width: 100%; padding: 18px; background: linear-gradient(45deg, var(--accent-secondary), var(--accent-primary)); color: white; border: none; border-radius: 8px; font-family: 'Cinzel', serif; font-weight: 900; cursor: pointer; letter-spacing: 2px; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="brand-container" onclick="switchModule('dashboard')">
        <span class="material-icons" style="font-size: 32px;">shield</span>
        <span class="brand-name">AURELIAN AI</span>
    </div>
    <div class="nav-item active" id="nav-dash" onclick="switchModule('dashboard')"><span class="material-icons">dashboard</span><span class="nav-text">Overview</span></div>
    <div class="nav-item" id="nav-token" onclick="switchModule('token-lab')"><span class="material-icons">calculate</span><span class="nav-text">Token Lab</span></div>
    <div class="nav-item" id="nav-arch" onclick="switchModule('architect')"><span class="material-icons">architecture</span><span class="nav-text">Architect Studio</span></div>
    <div class="nav-item" onclick="logout()"><span class="material-icons">logout</span><span class="nav-text">Logout</span></div>
</aside>

<div id="main-wrapper">
    <header class="top-bar">
        <h2 id="module-title" style="font-family: 'Cinzel', serif; color: var(--accent-primary);">ESTADO IMPERIAL</h2>
        <div class="monitor-tools">
            <div class="refresh-container">
                <div class="timer-circle">
                    <svg><circle cx="16" cy="16" r="14"></circle><circle class="progress" id="js-progress" cx="16" cy="16" r="14"></circle></svg>
                    <span id="timer-text">60</span>
                </div>
            </div>
            <div class="user-profile-top">
                <div class="user-info" style="text-align: right; margin-right: 10px;">
                    <span id="display-user-name" class="user-name">---</span>
                </div>
                <div class="user-avatar"><span class="material-icons">person</span></div>
            </div>
        </div>
    </header>

    <main class="content-area">
        <div class="card">

            <div id="view-dashboard" class="module-view active">
                <div class="stat-grid">
                    <div class="stat-card"><h3>Proyectos</h3><p id="stat-proyectos">--</p></div>
                    <div class="stat-card"><h3>Agentes</h3><p id="stat-agentes">--</p></div>
                    <div class="stat-card"><h3>Features</h3><p id="stat-tareas">--</p></div>
                </div>
                <h4 style="font-family: 'Cinzel'; font-size: 0.7rem; color: var(--gold); letter-spacing: 2px;">LOG DE OPERACIONES</h4>
                <div id="log-list" class="terminal-box"></div>
            </div>

            <div id="view-token-lab" class="module-view">
                <div id="chat-window" style="background:#05070a; border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; height: 350px; overflow-y: auto; font-family: monospace;">
                    > LISTO PARA BENCHMARK. Los resultados se mostrarán en la tabla incremental.
                </div>
                <div style="display: flex; gap: 10px; margin: 20px 0;">
                    <select id="model-select" style="width: 250px;">
                        <option value="all">COMPARE ALL MODELS</option>
                        <option value="llama3.2:latest">Llama 3.2</option>
                        <option value="codestral:latest">Codestral</option>
                        <option value="mistral-nemo:latest">Mistral Nemo</option>
                    </select>
                    <input type="text" id="chat-input" placeholder="Prompt para benchmark..." onkeypress="if(event.key==='Enter') startAnalysis()">
                    <button onclick="startAnalysis()" class="action-btn" style="width: 150px;">EJECUTAR</button>
                </div>
            </div>

            <div id="view-architect" class="module-view">
                <div class="input-group"><label>NOMBRE</label><input type="text" id="proj-name"></div>
                <div class="input-group"><label>VISIÓN</label><textarea id="proj-vision" style="height:100px;"></textarea></div>
                <button class="action-btn" onclick="initArchitectFlow()">INICIAR REFINAMIENTO</button>
                <div id="status-line" class="terminal-box" style="display:none; height: auto; margin-top: 20px;"></div>
            </div>

        </div>
    </main>
</div>

<script type="module">
    import { AurelianCore } from './js/aurelian-core.js';

    let timeLeft = 60;
    const circleFull = 88;

    window.onload = () => {
        const user = JSON.parse(localStorage.getItem('aurelian_user'));
        if (!user) window.location.href = "index.html";
        document.getElementById('display-user-name').innerText = user.nombre.toUpperCase();

        syncData();
        startMasterTimer();
    };

    function startMasterTimer() {
        setInterval(() => {
            timeLeft--;
            const progress = document.getElementById('js-progress');
            const timerText = document.getElementById('timer-text');

            const offset = circleFull - (timeLeft / 60) * circleFull;
            progress.style.strokeDashoffset = offset;
            timerText.innerText = timeLeft;

            if (timeLeft <= 0) {
                timeLeft = 60;
                syncData();
            }
        }, 1000);
    }

    async function syncData() {
        const logs = await AurelianCore.getLogs();
        document.getElementById('log-list').innerHTML = logs.map(l => `<p>${l}</p>`).join('');

        if(document.getElementById('view-dashboard').classList.contains('active')) {
            const stats = await AurelianCore.getStats();
            document.getElementById('stat-proyectos').innerText = stats.proyectos;
            document.getElementById('stat-agentes').innerText = stats.agentes;
            document.getElementById('stat-tareas').innerText = stats.tareas;
        }
    }

    window.startAnalysis = async function() {
        const input = document.getElementById('chat-input');
        const win = document.getElementById('chat-window');
        const prompt = input.value.trim();
        const modelVal = document.getElementById('model-select').value;
        if(!prompt) return;

        const models = modelVal === 'all' ? ['llama3.2:latest', 'mistral-nemo:latest', 'codestral:latest'] : [modelVal];

        // Crear tabla dinámica
        const tableId = `table-${Date.now()}`;
        let tableHTML = `
            <div style="margin-bottom: 20px;">
                <div style="color:var(--gold); margin-bottom: 10px;">> [BENCHMARK]: ${prompt}</div>
                <table class="benchmark-table" id="${tableId}">
                    <thead><tr><th>Motor AI</th><th>Velocidad (t/s)</th><th>Latencia</th><th>Estado</th></tr></thead>
                    <tbody>
                        ${models.map(m => `
                            <tr id="row-${m.replace(/[:.]/g, '-')}">
                                <td><b>${m.toUpperCase()}</b></td>
                                <td class="vel">--</td><td class="lat">--</td>
                                <td class="status"><span class="status-badge status-waiting">Esperando</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>`;

        win.innerHTML += tableHTML;
        input.value = "";
        win.scrollTop = win.scrollHeight;

        for (const m of models) {
            const row = document.querySelector(`#${tableId} #row-${m.replace(/[:.]/g, '-')}`);
            row.querySelector('.status').innerHTML = `<span class="status-badge status-running blink">Procesando</span>`;

            try {
                const data = await AurelianCore.runBenchmark(prompt, m);
                if(data.telemetria) {
                    const t = data.telemetria;
                    row.querySelector('.vel').innerText = t.velocidad;
                    row.querySelector('.lat').innerText = t.latencia_total;
                    row.querySelector('.status').innerHTML = `<span class="status-badge status-done">Completo</span>`;
                }
            } catch (e) {
                row.querySelector('.status').innerHTML = `<span style="color:var(--error-red)">Error</span>`;
            }
        }
        win.scrollTop = win.scrollHeight;
    };

    window.switchModule = (mod) => {
        document.querySelectorAll('.module-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        if(mod === 'dashboard') {
            document.getElementById('view-dashboard').classList.add('active');
            document.getElementById('nav-dash').classList.add('active');
        } else if(mod === 'token-lab') {
            document.getElementById('view-token-lab').classList.add('active');
            document.getElementById('nav-token').classList.add('active');
        } else if(mod === 'architect') {
            document.getElementById('view-architect').classList.add('active');
            document.getElementById('nav-arch').classList.add('active');
        }
    };

    window.logout = () => { localStorage.removeItem('aurelian_user'); window.location.href = "index.html"; };
</script>
</body>
</html>
