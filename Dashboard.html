<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURELIAN AI :: Command Center</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #020617;
            --panel-dark: #0b0d12;
            --accent-primary: #6366f1;
            --accent-secondary: #4338ca;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --border-color: #1f2533;
            --terminal-green: #4ade80;
            --gold: #facc15;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR --- */
        .sidebar { width: 80px; background-color: var(--panel-dark); border-right: 1px solid var(--border-color); padding: 20px 0; transition: width 0.3s ease; overflow: hidden; white-space: nowrap; flex-shrink: 0; z-index: 100; }
        .sidebar:hover { width: 260px; }
        .brand-container { display: flex; align-items: center; padding: 0 20px; margin-bottom: 40px; color: var(--accent-primary); }
        .brand-name { font-family: 'Cinzel', serif; font-weight: 900; font-size: 18px; margin-left: 15px; opacity: 0; transition: opacity 0.3s; letter-spacing: 2px; }
        .sidebar:hover .brand-name { opacity: 1; }

        .nav-item { display: flex; align-items: center; padding: 15px 25px; cursor: pointer; color: var(--text-dim); transition: 0.2s; border-left: 3px solid transparent; }
        .nav-item:hover, .nav-item.active { background-color: rgba(99, 102, 241, 0.1); color: white; border-left-color: var(--accent-primary); }
        .nav-item .material-icons { min-width: 30px; font-size: 24px; }
        .nav-text { opacity: 0; transition: opacity 0.2s; margin-left: 20px; font-weight: bold; }
        .sidebar:hover .nav-text { opacity: 1; }

        /* --- LAYOUT --- */
        #main-wrapper { flex: 1; display: flex; flex-direction: column; background-image: radial-gradient(circle at top right, #161b2d 0%, #020617 40%); overflow: hidden; }
        .top-bar { padding: 20px 40px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: rgba(2, 6, 23, 0.7); backdrop-filter: blur(10px); }
        .content-area { padding: 40px; flex: 1; overflow-y: auto; }
        .card { background: rgba(11, 13, 18, 0.8); backdrop-filter: blur(10px); padding: 30px; border-radius: 16px; border: 1px solid var(--border-color); max-width: 1000px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .module-view { display: none; }
        .module-view.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- OVERVIEW / DASHBOARD STYLES --- */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #05070a; padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; transition: 0.3s; }
        .stat-card:hover { border-color: var(--accent-primary); transform: translateY(-5px); }
        .stat-card h3 { color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .stat-card p { font-size: 2.5rem; font-weight: 900; color: var(--accent-primary); font-family: 'Cinzel', serif; }

        /* --- TOKEN LAB STYLES --- */
        #chat-window { height: 350px; background: #05070a; border-radius: 12px; padding: 20px; overflow-y: auto; border: 1px solid var(--border-color); font-family: 'Courier New', monospace; font-size: 13px; color: #a5b4fc; margin-bottom: 20px; }
        .msg.user { background: #1f2533; border: 1px solid #2d3748; color: white; margin-left: 20px; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .msg.bot { background: #0b0d12; border: 1px solid var(--accent-primary); padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .rank-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
        .rank-table th { text-align: left; color: var(--accent-primary); padding: 8px; border-bottom: 1px solid var(--accent-secondary); }
        .rank-table td { padding: 8px; border-bottom: 1px solid #1f2533; }

        /* --- ARCHITECT STYLES --- */
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; color: var(--accent-primary); font-size: 11px; font-weight: 900; margin-bottom: 8px; }
        .input-group input, .input-group textarea, select, #chat-input { width: 100%; background: #05070a; border: 1px solid var(--border-color); padding: 14px; color: white; border-radius: 8px; }
        .action-btn { width: 100%; padding: 16px; background: linear-gradient(45deg, var(--accent-secondary), var(--accent-primary)); color: white; border: none; border-radius: 8px; font-family: 'Cinzel', serif; font-weight: 900; cursor: pointer; letter-spacing: 1px; }
        .terminal-box { margin-top: 20px; background: #000; padding: 15px; border-left: 3px solid var(--terminal-green); font-family: 'Courier New', monospace; font-size: 12px; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="brand-container"><span class="material-icons" style="font-size: 32px;">shield</span><span class="brand-name">AURELIAN AI</span></div>
    <div class="nav-item active" id="nav-dash" onclick="switchModule('dashboard')"><span class="material-icons">dashboard</span><span class="nav-text">Overview</span></div>
    <div class="nav-item" id="nav-token" onclick="switchModule('token-lab')"><span class="material-icons">calculate</span><span class="nav-text">Token Lab</span></div>
    <div class="nav-item" id="nav-arch" onclick="switchModule('architect')"><span class="material-icons">architecture</span><span class="nav-text">Architect Studio</span></div>
</aside>

<div id="main-wrapper">
    <header class="top-bar">
        <h2 id="module-title" style="font-family: 'Cinzel', serif; color: var(--accent-primary);">ESTADO IMPERIAL</h2>
        <div id="core-status" style="font-size: 11px; color: var(--text-dim);">CORE: <span style="color: var(--terminal-green);">ONLINE</span></div>
    </header>

    <main class="content-area">
        <div class="card">

            <div id="view-dashboard" class="module-view active">
                <div class="stat-grid">
                    <div class="stat-card"><h3>Proyectos</h3><p id="stat-proyectos">--</p></div>
                    <div class="stat-card"><h3>Agentes</h3><p id="stat-agentes">--</p></div>
                    <div class="stat-card"><h3>Tareas</h3><p id="stat-tareas">--</p></div>
                </div>
                <div style="border-top: 1px solid var(--border-color); padding-top: 20px;">
                    <h4 style="font-family: 'Cinzel'; font-size: 0.8rem; color: var(--gold);">EVENTOS RECIENTES</h4>
                    <p style="font-size: 12px; color: var(--text-dim); margin-top: 10px;">> Sistema sincronizado con el Tabularium.</p>
                </div>
            </div>

            <div id="view-token-lab" class="module-view">
                <div id="chat-window">PROTOCOLO LISTO. Conversación persistente activada.</div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <select id="model-select" style="width: auto;">
                        <option value="all">TEST ALL</option>
                        <option value="codestral:latest">Codestral</option>
                    </select>
                    <input type="text" id="chat-input" placeholder="Prompt de benchmark..." onkeypress="if(event.key==='Enter') startAnalysis()">
                    <button onclick="startAnalysis()" class="action-btn" style="width: 120px;">TEST</button>
                </div>
            </div>

            <div id="view-architect" class="module-view">
                <div class="input-group">
                    <label>NOMBRE DEL PROYECTO</label>
                    <input type="text" id="proj-name" placeholder="Ej: Operacion Aureliano...">
                </div>
                <div class="input-group">
                    <label>VISIÓN ESTRATÉGICA</label>
                    <textarea id="proj-vision" placeholder="Describa la visión técnica..."></textarea>
                </div>
                <button id="btn-refine" class="action-btn" onclick="initArchitectFlow()">INICIAR REFINAMIENTO</button>
                <div id="terminal-output" class="terminal-box" style="display:none;">
                    <p id="status-line">Esperando transmisión...</p>
                </div>
            </div>

        </div>
    </main>
</div>

<script>
    const API_BASE = "http://localhost:8082/api/projects";
    const TOKEN_URL = "https://ungraphitized-collette-rheumatoidally.ngrok-free.dev/api/tokens/analizar";

    window.onload = () => {
        updateStats();
        // Actualizar stats cada 30 segundos
        setInterval(updateStats, 30000);
    };

    async function updateStats() {
        try {
            const resp = await fetch(`${API_BASE}/stats`);
            if(resp.ok) {
                const data = await resp.json();
                document.getElementById('stat-proyectos').innerText = data.proyectos;
                document.getElementById('stat-agentes').innerText = data.agentes;
                document.getElementById('stat-tareas').innerText = data.tareas;
            }
        } catch (e) {
            console.error("Error actualizando Tabularium stats");
        }
    }

    function switchModule(mod) {
        document.querySelectorAll('.module-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));

        if(mod === 'dashboard') {
            document.getElementById('view-dashboard').classList.add('active');
            document.getElementById('nav-dash').classList.add('active');
            document.getElementById('module-title').innerText = "ESTADO IMPERIAL";
            updateStats();
        } else if(mod === 'token-lab') {
            document.getElementById('view-token-lab').classList.add('active');
            document.getElementById('nav-token').classList.add('active');
            document.getElementById('module-title').innerText = "TOKEN LAB :: PERFORMANCE";
        } else if(mod === 'architect') {
            document.getElementById('view-architect').classList.add('active');
            document.getElementById('nav-arch').classList.add('active');
            document.getElementById('module-title').innerText = "ARCHITECT STUDIO :: SENTINEL";
        }
    }

    // --- LÓGICA DE TOKEN LAB (Persistente) ---
    async function startAnalysis() {
        const input = document.getElementById('chat-input');
        const win = document.getElementById('chat-window');
        const prompt = input.value.trim();
        if(!prompt) return;

        win.innerHTML += `<div class="msg user">> ${prompt}</div>`;
        input.value = "";
        win.scrollTop = win.scrollHeight;

        const models = document.getElementById('model-select').value === 'all' ? ['llama3.2:latest', 'mistral-nemo:latest'] : [document.getElementById('model-select').value];

        for (const model of models) {
            win.innerHTML += `<div id="load-${model}" style="font-size: 10px; color: var(--text-dim);">[TESTING] ${model}...</div>`;
            try {
                const resp = await fetch(TOKEN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ prompt, model })
                });
                if(resp.ok) {
                    const data = await resp.json();
                    document.getElementById(`load-${model}`).innerHTML = `<div class="msg bot"><b>${model}:</b> ${data.telemetria.velocidad} | ${data.telemetria.latencia_total}</div>`;
                }
            } catch (e) { document.getElementById(`load-${model}`).innerText = `[FAIL] ${model}`; }
        }
        win.scrollTop = win.scrollHeight;
    }

    // --- LÓGICA DE ARCHITECT ---
    async function initArchitectFlow() {
        const nombre = document.getElementById('proj-name').value;
        const vision = document.getElementById('proj-vision').value;
        const status = document.getElementById('status-line');
        if(!nombre || !vision) return alert("Faltan datos");

        document.getElementById('terminal-output').style.display = "block";
        status.innerText = "> Enviando vision al Tabularium...";

        try {
            const resp = await fetch(`${API_BASE}/init`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, vision })
            });
            if(resp.ok) {
                status.innerHTML = `<span style="color: var(--terminal-green);">> PROYECTO CREADO. Notificando a n8n...</span>`;
                updateStats();
            }
        } catch (e) { status.innerText = "> ERROR DE CONEXIÓN"; }
    }
</script>
</body>
</html>
