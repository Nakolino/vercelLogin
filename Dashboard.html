<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURELIAN AI :: Command Center</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #020617; --panel-dark: #0b0d12; --accent-primary: #6366f1;
            --text-main: #e2e8f0; --text-dim: #94a3b8; --border-color: #1f2533;
            --terminal-green: #4ade80; --gold: #facc15; --error-red: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        .sidebar { width: 80px; background-color: var(--panel-dark); border-right: 1px solid var(--border-color); padding: 20px 0; transition: width 0.3s; overflow: hidden; display: flex; flex-direction: column; z-index: 100; }
        .sidebar:hover { width: 260px; }
        .brand-container { display: flex; align-items: center; padding: 0 20px; margin-bottom: 40px; color: var(--accent-primary); cursor: pointer; }
        .brand-name { font-family: 'Cinzel', serif; font-weight: 900; font-size: 18px; margin-left: 15px; opacity: 0; transition: 0.3s; letter-spacing: 2px; }
        .sidebar:hover .brand-name { opacity: 1; }

        .nav-item { display: flex; align-items: center; padding: 15px 25px; cursor: pointer; color: var(--text-dim); border-left: 3px solid transparent; }
        .nav-item.active { background-color: rgba(99, 102, 241, 0.1); color: white; border-left-color: var(--accent-primary); }
        .nav-item .material-icons { min-width: 30px; }
        .nav-text { opacity: 0; transition: 0.2s; margin-left: 20px; font-weight: bold; }
        .sidebar:hover .nav-text { opacity: 1; }

        /* VITAL SIGNS */
        .health-monitor { padding: 15px; border-top: 1px solid var(--border-color); margin-top: auto; opacity: 0; transition: 0.3s; }
        .sidebar:hover .health-monitor { opacity: 1; }
        .led { width: 8px; height: 8px; border-radius: 50%; background: #475569; }
        .blink { animation: led-pulse 2s infinite; }
        @keyframes led-pulse {
            0% { opacity: 1; box-shadow: 0 0 8px var(--terminal-green); }
            50% { opacity: 0.4; box-shadow: 0 0 2px var(--terminal-green); }
            100% { opacity: 1; box-shadow: 0 0 8px var(--terminal-green); }
        }

        /* MAIN */
        #main-wrapper { flex: 1; display: flex; flex-direction: column; }
        .top-bar { padding: 15px 40px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: rgba(2, 6, 23, 0.7); backdrop-filter: blur(10px); }
        .timer-circle { position: relative; width: 32px; height: 32px; transform: rotate(-90deg); }
        .timer-circle circle { fill: none; stroke-width: 3; stroke: rgba(255,255,255,0.1); }
        .timer-circle .progress { stroke: var(--accent-primary); stroke-dasharray: 88; stroke-dashoffset: 88; transition: stroke-dashoffset 1s linear; }
        #timer-text { position: absolute; transform: rotate(90deg); font-size: 10px; font-weight: bold; color: var(--gold); }

        .user-chip { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 6px 15px; border-radius: 50px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.03); }

        .content-area { padding: 40px; flex: 1; overflow-y: auto; }
        .card { background: rgba(11, 13, 18, 0.8); padding: 30px; border-radius: 16px; border: 1px solid var(--border-color); max-width: 1000px; margin: auto; }

        .module-view { display: none; }
        .module-view.active { display: block; }

        #chat-window { background:#05070a; border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; height: 380px; overflow-y: auto; font-family: monospace; margin-bottom: 20px; color: #a5b4fc; }
        .benchmark-table { width: 100%; border-collapse: collapse; margin-top: 15px; border: 1px solid var(--border-color); font-size: 12px; }
        .benchmark-table th { background: #12151e; color: var(--accent-primary); padding: 10px; text-align: left; }
        .benchmark-table td { padding: 10px; border-bottom: 1px solid var(--border-color); }
        .terminal-box { background: #000; padding: 15px; border-left: 3px solid var(--accent-primary); font-family: monospace; font-size: 11px; color: var(--terminal-green); height: 180px; overflow-y: auto; }

        .action-btn { padding: 15px; background: linear-gradient(45deg, var(--accent-secondary), var(--accent-primary)); color: white; border: none; border-radius: 8px; cursor: pointer; font-family: 'Cinzel'; font-weight: bold; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="brand-container" onclick="window.switchModule('dashboard')">
        <span class="material-icons">shield</span>
        <span class="brand-name">AURELIAN AI</span>
    </div>
    <div class="nav-item active" id="nav-token" onclick="window.switchModule('token-lab')">
        <span class="material-icons">calculate</span>
        <span class="nav-text">Token Lab</span>
    </div>
    <div class="nav-item" id="nav-arch" onclick="window.switchModule('architect')">
        <span class="material-icons">architecture</span>
        <span class="nav-text">Architect Studio</span>
    </div>
    <div class="health-monitor">
        <p style="font-size: 8px; color: var(--gold); letter-spacing: 1px; margin-bottom: 10px;">VITAL SIGNS</p>
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <span style="font-size: 9px; color: var(--text-dim);">POSTGRES</span>
                <div id="led-db" class="led"></div>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <span style="font-size: 9px; color: var(--text-dim);">N8N ENGINE</span>
                <div id="led-n8n" class="led"></div>
            </div>
        </div>
    </div>
    <div class="nav-item" onclick="window.logout()" style="border-top: 1px solid var(--border-color); margin-top: 10px;">
        <span class="material-icons">logout</span>
        <span class="nav-text">Logout</span>
    </div>
</aside>

<div id="main-wrapper">
    <header class="top-bar">
        <h2 id="module-title" style="font-family:'Cinzel'; color:var(--accent-primary);">TOKEN LAB</h2>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div class="timer-container" style="display: flex; align-items:center; gap:10px;">
                <div class="timer-circle" style="display: flex; align-items: center; justify-content: center;">
                    <svg width="32" height="32"><circle cx="16" cy="16" r="14"></circle><circle id="js-progress" class="progress" cx="16" cy="16" r="14"></circle></svg>
                    <span id="timer-text">60</span>
                </div>
            </div>
            <div class="user-chip" onclick="window.switchModule('dashboard')">
                <span id="display-user-name" style="font-weight:bold; font-size:12px;">AGENTE</span>
                <span class="material-icons">analytics</span>
            </div>
        </div>
    </header>

    <main class="content-area">
        <div class="card">
            <div id="view-token-lab" class="module-view active">
                <div id="chat-window">> SISTEMA LISTO. PERSISTENCIA ACTIVA.</div>
                <div style="display: flex; gap: 10px;">
                    <select id="model-select" style="width: 200px; background:#05070a; color:white; border:1px solid var(--border-color); border-radius:8px; padding:10px;">
                        <option value="all">COMPARE ALL</option>
                        <option value="llama3.2:latest">Llama 3.2</option>
                        <option value="codestral:latest">Codestral</option>
                        <option value="mistral-nemo:latest">Mistral Nemo</option>
                    </select>
                    <input type="text" id="chat-input" style="flex:1; background:#05070a; color:white; border:1px solid var(--border-color); border-radius:8px; padding:10px;" placeholder="Benchmark prompt..." onkeypress="if(event.key==='Enter') window.startAnalysis()">
                    <button onclick="window.startAnalysis()" class="action-btn" style="width: 120px;">EJECUTAR</button>
                </div>
            </div>

            <div id="view-architect" class="module-view">
                <div style="margin-bottom: 20px;"><label style="font-size:11px; color:var(--accent-primary);">PROYECTO</label><input type="text" id="proj-name"></div>
                <div style="margin-bottom: 20px;"><label style="font-size:11px; color:var(--accent-primary);">VISIÓN</label><textarea id="proj-vision" style="height:100px; width:100%; background:#05070a; color:white; border:1px solid var(--border-color); border-radius:8px;"></textarea></div>
                <button class="action-btn" onclick="window.initArchitectFlow()">REFINAR</button>
            </div>

            <div id="view-dashboard" class="module-view">
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px;">
                    <div style="background:#05070a; padding:15px; border-radius:12px; border:1px solid var(--border-color); text-align:center;">
                        <span style="font-size:9px; color:var(--text-dim);">PROYECTOS</span>
                        <p id="stat-proyectos" style="font-size:24px; color:var(--accent-primary); font-family:'Cinzel';">--</p>
                    </div>
                    <div style="background:#05070a; padding:15px; border-radius:12px; border:1px solid var(--border-color); text-align:center;">
                        <span style="font-size:9px; color:var(--text-dim);">AGENTES</span>
                        <p id="stat-agentes" style="font-size:24px; color:var(--accent-primary); font-family:'Cinzel';">--</p>
                    </div>
                    <div style="background:#05070a; padding:15px; border-radius:12px; border:1px solid var(--border-color); text-align:center;">
                        <span style="font-size:9px; color:var(--text-dim);">FEATURES</span>
                        <p id="stat-tareas" style="font-size:24px; color:var(--accent-primary); font-family:'Cinzel';">--</p>
                    </div>
                </div>
                <div id="log-list" class="terminal-box"></div>
            </div>
        </div>
    </main>
</div>

<script type="module">
    import { AurelianCore } from './js/aurelian-core.js';

    let timeLeft = 60;
    const user = JSON.parse(localStorage.getItem('aurelian_user'));
    if (!user) window.location.href = "index.html";

    window.onload = () => {
        document.getElementById('display-user-name').innerText = user.nombre.toUpperCase();
        syncData();
        setInterval(() => {
            timeLeft--;
            const offset = 88 - (timeLeft / 60) * 88;
            document.getElementById('js-progress').style.strokeDashoffset = offset;
            document.getElementById('timer-text').innerText = timeLeft;
            if (timeLeft <= 0) { timeLeft = 60; syncData(); }
        }, 1000);
    };

    async function syncData() {
        const health = await AurelianCore.getSystemHealth();
        if (health) {
            const dbLed = document.getElementById('led-db');
            const n8nLed = document.getElementById('led-n8n');
            dbLed.style.background = health.database === "ONLINE" ? "var(--terminal-green)" : "var(--error-red)";
            if(health.database === "ONLINE") dbLed.classList.add('blink');
            n8nLed.style.background = health.n8n === "ONLINE" ? "var(--terminal-green)" : "var(--error-red)";
            if(health.n8n === "ONLINE") n8nLed.classList.add('blink');
        }

        const logs = await AurelianCore.getLogs();
        document.getElementById('log-list').innerHTML = logs.map(l => `<p>${l}</p>`).join('');

        const stats = await AurelianCore.getStats();
        document.getElementById('stat-proyectos').innerText = stats.proyectos;
        document.getElementById('stat-agentes').innerText = stats.agentes;
        document.getElementById('stat-tareas').innerText = stats.tareas;
    }

    // EXPORTAR A WINDOW PARA QUE LOS BOTONES FUNCIONEN
    window.switchModule = (mod) => {
        document.querySelectorAll('.module-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById(`view-${mod}`).classList.add('active');
        if (mod === 'token-lab') document.getElementById('nav-token').classList.add('active');
        if (mod === 'architect') document.getElementById('nav-arch').classList.add('active');
        document.getElementById('module-title').innerText = mod.toUpperCase().replace('-', ' ');
    };

    window.startAnalysis = async () => {
        const win = document.getElementById('chat-window');
        const prompt = document.getElementById('chat-input').value.trim();
        if (!prompt) return;
        const model = document.getElementById('model-select').value;
        const models = model === 'all' ? ['llama3.2:latest', 'mistral-nemo:latest', 'codestral:latest'] : [model];

        win.innerHTML += `<div style="color:var(--gold); margin:10px 0;">> [BENCHMARK]: ${prompt}</div>`;
        const tableId = `t-${Date.now()}`;
        win.innerHTML += `<table class="benchmark-table" id="${tableId}"><thead><tr><th>Motor</th><th>t/s</th><th>Latencia</th><th>Estado</th></tr></thead><tbody>${models.map(m => `<tr id="row-${m.replace(/[:.]/g, '-')}"><td>${m}</td><td class="vel">--</td><td class="lat">--</td><td class="st"><span class="running">Wait</span></td></tr>`).join('')}</tbody></table>`;
        document.getElementById('chat-input').value = "";

        for (const m of models) {
            const row = document.querySelector(`#${tableId} #row-${m.replace(/[:.]/g, '-')}`);
            row.querySelector('.st').innerHTML = `<span class="blink" style="color:var(--gold)">Run</span>`;
            try {
                const data = await AurelianCore.runBenchmark(prompt, m);
                row.querySelector('.vel').innerText = data.telemetria.velocidad;
                row.querySelector('.lat').innerText = data.telemetria.latencia_total;
                row.querySelector('.st').innerHTML = `<span class="done">Done</span>`;
            } catch (e) { row.querySelector('.st').innerText = "Fail"; }
        }
        win.scrollTop = win.scrollHeight;
    };

    window.initArchitectFlow = async () => {
        const d = await AurelianCore.initProject(document.getElementById('proj-name').value, document.getElementById('proj-vision').value);
        if (d.id) alert("Proyecto en Tabularium.");
    };

    window.logout = () => { localStorage.removeItem('aurelian_user'); window.location.href = "index.html"; };
</script>
</body>
</html>
