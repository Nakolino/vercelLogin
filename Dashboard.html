<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURELIAN AI :: Command Center</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #020617;
            --panel-dark: #0b0d12;
            --accent-primary: #6366f1;
            --accent-secondary: #4338ca;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --border-color: #1f2533;
            --terminal-green: #4ade80;
            --gold: #facc15;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* --- SIDEBAR --- */
        .sidebar { width: 80px; background-color: var(--panel-dark); border-right: 1px solid var(--border-color); padding: 20px 0; transition: width 0.3s; overflow: hidden; white-space: nowrap; flex-shrink: 0; z-index: 100; }
        .sidebar:hover { width: 260px; }
        .brand-container { display: flex; align-items: center; padding: 0 20px; margin-bottom: 40px; color: var(--accent-primary); cursor: pointer; }
        .brand-name { font-family: 'Cinzel', serif; font-weight: 900; font-size: 18px; margin-left: 15px; opacity: 0; transition: 0.3s; letter-spacing: 2px; }
        .sidebar:hover .brand-name { opacity: 1; }

        .nav-item { display: flex; align-items: center; padding: 15px 25px; cursor: pointer; color: var(--text-dim); border-left: 3px solid transparent; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background-color: rgba(99, 102, 241, 0.1); color: white; border-left-color: var(--accent-primary); }
        .nav-item .material-icons { min-width: 30px; font-size: 24px; }
        .nav-text { opacity: 0; transition: 0.2s; margin-left: 20px; font-weight: bold; }
        .sidebar:hover .nav-text { opacity: 1; }

        /* --- TOP BAR & ATENEA TIMER --- */
        #main-wrapper { flex: 1; display: flex; flex-direction: column; background-image: radial-gradient(circle at top right, #161b2d 0%, #020617 40%); overflow: hidden; }
        .top-bar { padding: 15px 40px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: rgba(2, 6, 23, 0.7); backdrop-filter: blur(10px); }

        .monitor-controls { display: flex; align-items: center; gap: 20px; }
        .timer-container { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); padding: 5px 12px; border-radius: 50px; border: 1px solid var(--border-color); }
        .timer-circle { position: relative; width: 32px; height: 32px; }
        .timer-circle svg { transform: rotate(-90deg); width: 32px; height: 32px; }
        .timer-circle circle { fill: none; stroke-width: 3; stroke: rgba(255,255,255,0.1); }
        .timer-circle .progress { stroke: var(--accent-primary); stroke-dasharray: 88; stroke-dashoffset: 88; transition: stroke-dashoffset 1s linear; }
        #timer-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 10px; font-weight: bold; color: var(--gold); }

        .user-profile { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 32px; height: 32px; background: var(--accent-secondary); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; }

        /* --- CONTENT & TABLES --- */
        .content-area { padding: 40px; flex: 1; overflow-y: auto; }
        .card { background: rgba(11, 13, 18, 0.8); backdrop-filter: blur(10px); padding: 30px; border-radius: 16px; border: 1px solid var(--border-color); max-width: 1000px; margin: auto; }

        .module-view { display: none; }
        .module-view.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .benchmark-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #05070a; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        .benchmark-table th { background: #12151e; color: var(--accent-primary); padding: 12px; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .benchmark-table td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); font-size: 12px; }

        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 9px; font-weight: bold; text-transform: uppercase; }
        .waiting { border: 1px solid #1f2533; color: var(--text-dim); }
        .running { border: 1px solid var(--gold); color: var(--gold); }
        .done { border: 1px solid var(--terminal-green); color: var(--terminal-green); background: rgba(74, 222, 128, 0.05); }

        .terminal-box { margin-top: 15px; background: #000; padding: 15px; border-left: 3px solid var(--accent-primary); font-family: 'Courier New', monospace; font-size: 11px; color: var(--terminal-green); height: 180px; overflow-y: auto; }
        input, select, textarea { width: 100%; background: #05070a; border: 1px solid var(--border-color); padding: 14px; color: white; border-radius: 8px; }
        .action-btn { width: 100%; padding: 18px; background: linear-gradient(45deg, var(--accent-secondary), var(--accent-primary)); color: white; border: none; border-radius: 8px; font-family: 'Cinzel', serif; font-weight: 900; cursor: pointer; letter-spacing: 2px; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="brand-container" onclick="location.reload()">
        <span class="material-icons" style="font-size: 32px;">shield</span>
        <span class="brand-name">AURELIAN AI</span>
    </div>
    <div class="nav-item active" id="nav-token" onclick="switchModule('token-lab')">
        <span class="material-icons">calculate</span>
        <span class="nav-text">Token Lab</span>
    </div>
    <div class="nav-item" id="nav-dash" onclick="switchModule('dashboard')">
        <span class="material-icons">dashboard</span>
        <span class="nav-text">Overview</span>
    </div>
    <div class="nav-item" onclick="logout()">
        <span class="material-icons">logout</span>
        <span class="nav-text">Cerrar Sesión</span>
    </div>
</aside>

<div id="main-wrapper">
    <header class="top-bar">
        <h2 id="module-title" style="font-family: 'Cinzel', serif; color: var(--accent-primary);">TOKEN LAB :: PERFORMANCE</h2>

        <div class="monitor-controls">
            <div class="timer-container" title="Próximo refresh de datos">
                <div class="timer-circle">
                    <svg><circle cx="16" cy="16" r="14"></circle><circle class="progress" id="js-progress" cx="16" cy="16" r="14"></circle></svg>
                    <span id="timer-text">60</span>
                </div>
            </div>
            <div class="user-profile">
                <span id="display-user-name" style="font-weight: bold; font-size: 13px;">---</span>
                <div class="user-avatar"><span class="material-icons">person</span></div>
            </div>
        </div>
    </header>

    <main class="content-area">
        <div class="card">

            <div id="view-token-lab" class="module-view active">
                <div id="chat-window" style="background:#05070a; border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; height: 350px; overflow-y: auto; font-family: monospace;">
                    > SISTEMA DE TELEMETRÍA LISTO. SELECCIONE MODELOS PARA INICIAR STRESS TEST.
                </div>
                <div style="display: flex; gap: 10px; margin: 20px 0;">
                    <select id="model-select" style="width: 250px;">
                        <option value="all">COMPARE ALL MODELS</option>
                        <option value="llama3.2:latest">Llama 3.2</option>
                        <option value="codestral:latest">Codestral</option>
                        <option value="mistral-nemo:latest">Mistral Nemo</option>
                    </select>
                    <input type="text" id="chat-input" placeholder="Prompt para benchmark..." onkeypress="if(event.key==='Enter') startAnalysis()">
                    <button onclick="startAnalysis()" class="action-btn" style="width: 150px;">EJECUTAR</button>
                </div>
            </div>

            <div id="view-dashboard" class="module-view">
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px;">
                    <div style="text-align:center; background:#05070a; padding:20px; border-radius:12px; border:1px solid var(--border-color);">
                        <h3 style="font-size:10px; color:var(--text-dim);">PROYECTOS</h3>
                        <p id="stat-proyectos" style="font-size:30px; font-family:'Cinzel'; color:var(--accent-primary);">--</p>
                    </div>
                    <div style="text-align:center; background:#05070a; padding:20px; border-radius:12px; border:1px solid var(--border-color);">
                        <h3 style="font-size:10px; color:var(--text-dim);">AGENTES</h3>
                        <p id="stat-agentes" style="font-size:30px; font-family:'Cinzel'; color:var(--accent-primary);">--</p>
                    </div>
                    <div style="text-align:center; background:#05070a; padding:20px; border-radius:12px; border:1px solid var(--border-color);">
                        <h3 style="font-size:10px; color:var(--text-dim);">FEATURES</h3>
                        <p id="stat-tareas" style="font-size:30px; font-family:'Cinzel'; color:var(--accent-primary);">--</p>
                    </div>
                </div>
                <h4 style="font-family: 'Cinzel'; font-size: 0.7rem; color: var(--gold); letter-spacing: 2px;">LOG DE OPERACIONES REAL-TIME</h4>
                <div id="log-list" class="terminal-box"></div>
            </div>

        </div>
    </main>
</div>

<script type="module">
    import { AurelianCore } from './js/aurelian-core.js';

    let timeLeft = 60;
    const circleFull = 88;

    // Ejecución inicial y validación de acceso
    const user = JSON.parse(localStorage.getItem('aurelian_user'));
    if (!user) window.location.href = "index.html";

    window.onload = () => {
        document.getElementById('display-user-name').innerText = user.nombre.toUpperCase();
        syncData();
        startAteneaTimer();
    };

    // Cronómetro Atenea (60s)
    function startAteneaTimer() {
        setInterval(() => {
            timeLeft--;
            const progress = document.getElementById('js-progress');
            const timerText = document.getElementById('timer-text');

            const offset = circleFull - (timeLeft / 60) * circleFull;
            progress.style.strokeDashoffset = offset;
            timerText.innerText = timeLeft;

            if (timeLeft <= 0) {
                timeLeft = 60;
                syncData(); // Dispara refresh de logs y stats
            }
        }, 1000);
    }

    async function syncData() {
        // Logs
        const logs = await AurelianCore.getLogs();
        document.getElementById('log-list').innerHTML = logs.map(l => `<p>${l}</p>`).join('');

        // Stats
        const stats = await AurelianCore.getStats();
        if(stats) {
            document.getElementById('stat-proyectos').innerText = stats.proyectos;
            document.getElementById('stat-agentes').innerText = stats.agentes;
            document.getElementById('stat-tareas').innerText = stats.tareas;
        }
    }

    // Benchmark con Tabla Incremental
    window.startAnalysis = async function() {
        const input = document.getElementById('chat-input');
        const win = document.getElementById('chat-window');
        const prompt = input.value.trim();
        const modelVal = document.getElementById('model-select').value;
        if(!prompt) return;

        const models = modelVal === 'all' ? ['llama3.2:latest', 'mistral-nemo:latest', 'codestral:latest'] : [modelVal];
        const tableId = `t-${Date.now()}`;

        // Inyectar tabla inicial
        win.innerHTML += `
            <div style="margin-bottom: 25px;">
                <div style="color:var(--gold); margin-bottom:10px;">> [BENCHMARK]: ${prompt}</div>
                <table class="benchmark-table" id="${tableId}">
                    <thead><tr><th>Motor AI</th><th>Velocidad (t/s)</th><th>Latencia</th><th>Estado</th></tr></thead>
                    <tbody>
                        ${models.map(m => `
                            <tr id="row-${m.replace(/[:.]/g, '-')}">
                                <td><b>${m.toUpperCase()}</b></td>
                                <td class="vel">--</td><td class="lat">--</td>
                                <td class="status"><span class="status-badge waiting">Waiting</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>`;

        input.value = "";
        win.scrollTop = win.scrollHeight;

        for (const m of models) {
            const row = document.querySelector(`#${tableId} #row-${m.replace(/[:.]/g, '-')}`);
            row.querySelector('.status').innerHTML = `<span class="status-badge running blink">Running</span>`;

            try {
                const data = await AurelianCore.runBenchmark(prompt, m);
                if(data.telemetria) {
                    const t = data.telemetria;
                    row.querySelector('.vel').innerText = t.velocidad;
                    row.querySelector('.lat').innerText = t.latencia_total;
                    row.querySelector('.status').innerHTML = `<span class="status-badge done">Done</span>`;
                }
            } catch (e) {
                row.querySelector('.status').innerHTML = `<span style="color:red">Fail</span>`;
            }
        }
    };

    window.switchModule = (mod) => {
        document.querySelectorAll('.module-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));

        if(mod === 'dashboard') {
            document.getElementById('view-dashboard').classList.add('active');
            document.getElementById('nav-dash').classList.add('active');
            document.getElementById('module-title').innerText = "ESTADO IMPERIAL";
        } else {
            document.getElementById('view-token-lab').classList.add('active');
            document.getElementById('nav-token').classList.add('active');
            document.getElementById('module-title').innerText = "TOKEN LAB :: PERFORMANCE";
        }
    }

    window.logout = () => { localStorage.removeItem('aurelian_user'); window.location.href = "index.html"; };
</script>
</body>
</html>
