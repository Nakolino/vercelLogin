<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURELIAN AI - Multi-Agent System</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #161616;
            --accent-color: #00f2ff;
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- VISTA DE LOGIN --- */
        #login-view {
            background: var(--panel-bg);
            padding: 40px;
            border-radius: 10px;
            border: 1px solid var(--accent-color);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            text-align: center;
            width: 350px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #222;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: black;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 15px var(--accent-color);
        }

        /* --- DASHBOARD PRINCIPAL --- */
        #dashboard-view {
            display: none; /* Se activa al loguear */
            width: 95vw;
            height: 90vh;
            grid-template-columns: 300px 1fr 350px;
            gap: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        header {
            grid-column: 1 / span 3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid var(--accent-color);
        }

        /* --- CHAT Y LAB --- */
        #chat-output, #lab-output {
            flex-grow: 1;
            overflow-y: auto;
            background: #0a0a0a;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-family: monospace;
            border: 1px solid #222;
        }

        .system-msg { color: var(--accent-color); margin-bottom: 10px; }
        .user-msg { color: #fff; margin-bottom: 10px; }

        .hidden { display: none !important; }

    </style>
</head>
<body>

<div id="login-view">
    <h1 style="color: var(--accent-color);">AURELIAN</h1>
    <p>System Authentication</p>
    <input type="text" id="username" placeholder="Nombre del Agente">
    <input type="password" id="password" placeholder="Passcode">
    <button onclick="intentarLogin()">INICIAR PROTOCOLO</button>
</div>

<div id="dashboard-view">
    <header>
        <h2 style="margin:0;">AURELIAN <span style="color: var(--accent-color); font-size: 0.6em;">v1.0</span></h2>
        <div id="user-info">Agente: <span id="display-name" style="color: var(--accent-color);">---</span></div>
    </header>

    <div class="panel">
        <h3>Flota de Agentes</h3>
        <ul style="list-style: none; padding: 0;">
            <li style="color: var(--accent-color);">● Scrum Master (Active)</li>
            <li>○ Programador (Idle)</li>
            <li>○ QA Engine (Idle)</li>
        </ul>
    </div>

    <div class="panel">
        <h3>Centro de Mando</h3>
        <div id="chat-output"></div>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="chat-input" placeholder="Enviar comando al orquestador...">
            <button style="width: 100px;" onclick="enviarChat()">ENVIAR</button>
        </div>
    </div>

    <div class="panel">
        <h3 style="color: var(--accent-color);">Aurelian Lab</h3>

        <label style="font-size: 0.8em;">LLM Target:</label>
        <select id="llm-model">
            <option value="llama3.2:latest">Llama 3.2 (2.0 GB)</option>
            <option value="mistral-nemo:latest">Mistral Nemo (7.1 GB)</option>
            <option value="codestral:latest">Codestral (12 GB)</option>
            <option value="nomic-embed-text:latest">Nomic Embed</option>
        </select>

        <div id="lab-output">
            <pre id="token-result">Esperando análisis...</pre>
        </div>

        <textarea id="lab-input" style="width:100%; height:100px; background:#222; color:white; border:none; padding:10px; border-radius:5px;" placeholder="Pega aquí el prompt para contar tokens..."></textarea>
        <button style="margin-top:10px;" onclick="analizarTokens()">ANALIZAR LLM</button>
    </div>
</div>

<script>
    // CONFIGURACIÓN: Reemplaza con tu URL de Ngrok
    const API_BASE = "https://tu-url-ngrok.ngrok-free.dev/api";

    // --- LÓGICA DE NAVEGACIÓN ---
    function intentarLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        if(!user) return alert("Ingresa un nombre");

        fetch(`${API_BASE}/agentes/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre: user, password: pass })
        })
            .then(res => res.json())
            .then(data => {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('dashboard-view').style.display = 'grid';
                document.getElementById('display-name').innerText = data.nombre;
            })
            .catch(err => alert("Error de conexión. ¿Ngrok está activo?"));
    }

    // --- LÓGICA DEL CHAT ---
    async function enviarChat() {
        const input = document.getElementById('chat-input');
        const output = document.getElementById('chat-output');
        const text = input.value;
        const nombre = document.getElementById('display-name').innerText;

        if(!text) return;

        output.innerHTML += `<div class="user-msg">> ${text}</div>`;
        input.value = "";

        try {
            const res = await fetch(`${API_BASE}/agentes/chat`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: text, nombre: nombre, rol: "ADMIN" })
            });
            const respuesta = await res.text();
            output.innerHTML += `<div class="system-msg">AURELIAN: ${respuesta}</div>`;
        } catch (e) {
            output.innerHTML += `<div style="color:red;">Error de conexión.</div>`;
        }
        output.scrollTop = output.scrollHeight;
    }

    // --- LÓGICA DEL LAB (TOKENS + COMBO) ---
    async function analizarTokens() {
        const text = document.getElementById('lab-input').value;
        const model = document.getElementById('llm-model').value; // Captura del combo
        const resultBox = document.getElementById('token-result');

        if(!text) return alert("Escribe algo para analizar");

        resultBox.innerText = "Calculando en n8n...";

        try {
            const res = await fetch(`${API_BASE}/tokens/analizar`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: text, model: model }) // Enviamos el modelo elegido
            });
            const data = await res.json();

            // Formateamos la respuesta para que se vea profesional
            resultBox.innerHTML = `
MODELO: ${data.modelo_detectado || model}
TOKENS: ${data.tokens || 'N/A'}
CHARS:  ${data.caracteres || text.length}
STATUS: SUCCESS
                `;
        } catch (e) {
            resultBox.innerText = "Error: n8n no responde.";
        }
    }
</script>
</body>
</html>
