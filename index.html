<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURELIAN :: Acceso al Sistema</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #020617;
            --panel-dark: #0b0d12;
            --accent-primary: #6366f1;
            --accent-secondary: #4338ca;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --border-color: #1e1b4b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: var(--panel-dark);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            margin-bottom: 30px;
        }

        .logo-area i {
            font-size: 3rem;
            color: var(--accent-primary);
            margin-bottom: 15px;
        }

        .logo-area h1 {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            letter-spacing: 4px;
            font-size: 1.8rem;
            color: #ffffff;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header p {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-primary);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            background-color: #05070a;
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            color: white;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, var(--accent-secondary), var(--accent-primary));
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #statusText {
            margin-top: 20px;
            font-size: 12px;
            font-weight: 600;
            min-height: 15px;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 10px;
            color: #475569;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo-area">
        <i class="fas fa-shield-halved"></i>
        <h1>AURELIAN</h1>
    </div>

    <div class="login-header">
        <p>Acceso al Tabularium</p>
    </div>

    <form id="loginForm">
        <div class="input-group">
            <label for="username">IDENTIFICADOR DE AGENTE</label>
            <input type="text" id="username" placeholder="Nombre de agente..." required autocomplete="off">
        </div>

        <div class="input-group">
            <label for="password">CÓDIGO DE ACCESO</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" id="loginBtn">INICIAR PROTOCOLO</button>
    </form>

    <p id="statusText"></p>

    <div class="footer-note">
        SISTEMA DE GESTIÓN DE AGENTES V1.0
    </div>
</div>

<script>
    // Dirección del backend de Spring Boot
    const API_URL = "http://localhost:8082/api/agentes/login";

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const statusText = document.getElementById('statusText');
        const loginBtn = document.getElementById('loginBtn');

        // Feedback Visual
        statusText.style.color = "#94a3b8";
        statusText.innerText = "VERIFICANDO CREDENCIALES...";
        loginBtn.disabled = true;
        loginBtn.innerText = "PROCESANDO...";

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    nombre: username,
                    password: password
                })
            });

            if (response.ok) {
                // 1. CAPTURAMOS EL OBJETO AGENTE COMPLETO
                const agente = await response.json();

                // 2. PERSISTENCIA EN SESIÓN
                localStorage.setItem('aurelian_user', JSON.stringify(agente));

                statusText.style.color = "#4ade80";
                statusText.innerText = "ACCESO CONCEDIDO. REDIRECCIONANDO...";

                // Redirigir al Dashboard tras un breve delay
                setTimeout(() => {
                    window.location.href = "Dashboard.html";
                }, 1000);
            } else {
                statusText.style.color = "#f87171";
                statusText.innerText = "ERROR: CREDENCIALES INVÁLIDAS.";
                loginBtn.disabled = false;
                loginBtn.innerText = "INICIAR PROTOCOLO";
            }
        } catch (error) {
            statusText.style.color = "#f87171";
            statusText.innerText = "ERROR: NO SE PUDO CONTACTAR AL SERVIDOR.";
            loginBtn.disabled = false;
            loginBtn.innerText = "REINTENTAR";
            console.error("Login Error:", error);
        }
    });

    // Limpiar sesión al cargar el login por seguridad
    localStorage.removeItem('aurelian_user');
</script>
</body>
</html>
</html>
